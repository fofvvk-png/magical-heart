<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>3D Magical Glowing Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const beamParticles = [];
    const particleCount = 3800;
    const BLUE_SHADES = ["#60a5fa", "#93c5fd", "#3b82f6", "#2563eb", "#bfdbfe", "#ffffff", "#e0f2fe", "#38bdf8"];

    // Daha dəqiq və gözəl 3D ürək forması düsturu
    function getHeartPoint(scale) {
        let t = Math.random() * Math.PI * 2;
        let u = Math.random(); // Daxili dolğunluq üçün
        let r = Math.sqrt(u);

        // Tam klassik ürək parametrik düsturu
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        let factor = (scale / 16) * r;
        return {
            x: x * factor,
            y: y * factor
        };
    }

    class HeartParticle {
        constructor(scale) {
            this.scale = scale;
            
            const pt = getHeartPoint(this.scale);
            this.targetX = pt.x;
            this.targetY = pt.y;
            this.z = (Math.random() - 0.5) * this.scale * 1.1;

            // Başlanğıcda kənarlardan uçuş
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * canvas.width + 400;
            this.x = Math.cos(angle) * dist;
            this.y = Math.sin(angle) * dist;

            this.size = Math.random() * 1.3 + 0.4;
            this.color = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
            this.alpha = Math.random() * 0.85 + 0.15;
            
            // Yığılma sürəti daha tez edildi (0.05 - 0.08)
            this.ease = Math.random() * 0.04 + 0.04;
        }

        update() {
            this.x += (this.targetX - this.x) * this.ease;
            this.y += (this.targetY - this.y) * this.ease;
        }

        draw(beatScale, centerX, centerY) {
            const rotX = this.x * beatScale;
            const rotY = this.y * beatScale;

            const fov = 450;
            const scale3D = fov / (fov + this.z);

            const screenX = centerX + rotX * scale3D;
            const screenY = centerY + rotY * scale3D;
            const finalSize = Math.max(0.1, this.size * scale3D);

            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha * scale3D);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 6 * scale3D;
            ctx.shadowColor = this.color;
            
            ctx.beginPath();
            ctx.arc(screenX, screenY, finalSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    class BeamParticle {
        constructor(centerX, platformY, heartWidth) {
            this.centerX = centerX;
            this.platformY = platformY;
            this.heartWidth = heartWidth;
            this.reset();
        }

        reset() {
            this.x = this.centerX + (Math.random() - 0.5) * (this.heartWidth * 1.4);
            this.y = this.platformY + (Math.random() - 0.5) * 20;
            this.speedY = Math.random() * 2.5 + 1;
            this.size = Math.random() * 1.5 + 0.3;
            this.alpha = Math.random() * 0.7 + 0.3;
            this.color = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
        }

        update(targetY) {
            this.y -= this.speedY;
            this.alpha -= 0.007;

            if (this.y <= targetY || this.alpha <= 0) {
                this.reset();
            }
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    const heartScale = 170;
    const heartCenterY = canvas.height / 2 - 30;
    const platformY = heartCenterY + 240;

    for (let i = 0; i < particleCount; i++) {
        particles.push(new HeartParticle(heartScale));
    }

    for (let i = 0; i < 120; i++) {
        beamParticles.push(new BeamParticle(canvas.width / 2, platformY, heartScale));
    }

    function drawPlatform(cx, cy) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, 0.22);

        ctx.beginPath();
        ctx.arc(0, 0, 260, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(37, 99, 235, 0.15)";
        ctx.shadowBlur = 60;
        ctx.shadowColor = "#3b82f6";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, 180, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(147, 197, 253, 0.9)";
        ctx.shadowBlur = 35;
        ctx.shadowColor = "#60a5fa";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, 90, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.98)";
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#ffffff";
        ctx.fill();

        ctx.restore();
    }

    // Premium Zərif Mətn
    function drawPremiumText(cx, cy, beatScale, time) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(beatScale, beatScale);

        // Zərif kaligrafik / modern şrift
        ctx.font = "italic 600 44px 'Playfair Display', 'Georgia', 'Cinzel', serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Yavaşca dəyişən parıltı işığı
        const glowAmount = 15 + Math.sin(time * 3) * 8;

        // Xarici Qızılı / Mavi Parıltı (Glow)
        ctx.shadowColor = "#93c5fd";
        ctx.shadowBlur = glowAmount;

        // Gradient Rəng (Ağdan açıq göyə)
        const gradient = ctx.createLinearGradient(-100, 0, 100, 0);
        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.5, "#e0f2fe");
        gradient.addColorStop(1, "#93c5fd");

        ctx.fillStyle = gradient;
        ctx.fillText("Hello mama", 0, 0);

        // İncə kontur (Lüks görünüş üçün)
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
        ctx.strokeText("Hello mama", 0, 0);

        ctx.restore();
    }

    let time = 0;

    function animate() {
        ctx.fillStyle = "rgba(3, 7, 18, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;

        drawPlatform(cx, platformY);

        beamParticles.forEach(bp => {
            bp.update(heartCenterY);
            bp.draw();
        });

        time += 0.04;
        const beatScale = 1 + Math.sin(time * 2) * 0.03;

        particles.forEach(p => {
            p.update();
            p.draw(beatScale, cx, heartCenterY);
        });

        // Premium Mətn
        drawPremiumText(cx, heartCenterY, beatScale, time);

        requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
